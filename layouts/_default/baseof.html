<!DOCTYPE html>
<html lang="{{.Site.Language.Lang }}">
    <head>
        <meta charset="utf-8">
        {{- partial "seo_schema" . -}}
        <title>{{ block "title" . }}{{ if .IsHome }}{{ .Site.Params.homeTitle | default .Site.Title }}{{ else }}{{ .Title }} &ndash; {{ .Site.Title }}{{ end }}{{ end }}</title>
        {{- partial "head.html" . -}}
    </head>
    <body>
        {{- block "main" . }}{{- end }}
        {{- partial "js.html" . -}}
    </body>
</html>
