{{ $data := (.Scratch.Get "content").PersonalData }}
{{ with $data }}
<header class="cv-head">
    {{- with .Suffix }}<p class="cv-kicker">{{ strings.TrimLeft "- " . }}</p>{{ end }}
    <h1>{{ .Name }}</h1>
    {{- with .CurrentWorkplace }}<p class="subtitle">{{ . }}</p>{{ end }}
</header>
{{ end }}
